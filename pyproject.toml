[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mailkit"
version = "0.1.0"
description = "Terminal mail with a sealed local mirror per account (mbsync + notmuch + gocryptfs)"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
mailkit = "mailkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
